<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Materials</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --muted: #617487;
      --paper: #f6f8fb;
      --card: #ffffff;
      --accent: #d96c4f;
      --line: #dbe4ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at top right, #fff1df, transparent 38%), var(--paper);
      font: 16px/1.6 Georgia, "Times New Roman", serif;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 12vh 0 8vh;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font: 700 0.78rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 560px;
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 520px;
      margin: 24px 0 44px;
      color: var(--muted);
      font-size: 1.15rem;
    }

    .materials {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    a:hover, a:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(23, 50, 77, 0.08);
      transform: translateY(-2px);
    }

    .name {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .arrow {
      color: var(--accent);
      font: 1.5rem/1 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">SAA-C03 study hub</p>
    <h1>Choose your study sheet.</h1>
    <p class="intro">A compact set of notes, practice material, mistakes, and final review resources.</p>

    <nav class="materials" aria-label="Study materials">
      <a href="datafiles/1-CHEATSHEET.html">
        <span class="name">Cheatsheet</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </a>
      <a href="datafiles/2-PRACTICE-QUIZ.html">
        <span class="name">Practice Quiz</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </a>
      <a href="datafiles/3-MISTAKES.html">
        <span class="name">Mistakes</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </a>
      <a href="datafiles/4-FINAL-SHEET.html">
        <span class="name">Final Sheet</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </a>
    </nav>
  </main>
</body>
</html>
